# .pre-commit-config.yaml
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.5
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  # Removed check-dockerfile (deprecated/removed)
- repo: https://github.com/hadolint/hadolint
  rev: v2.12.0
  hooks:
  - id: hadolint  # Dockerfile linting for best practices and security
    files: (^|/)Dockerfile.*
    args: [--ignore, DL3008, --ignore, DL3059, --ignore, DL3025]  # Ignore version pinning and consecutive RUN commands
- repo: https://github.com/adrienverge/yamllint
  rev: v1.37.1
  hooks:
  - id: yamllint  # YAML file linting for docker-compose.yml
    args: [-d, '{extends: relaxed, rules: {line-length: {max: 120}, new-lines: disable}}']
- repo: local
  hooks:
  - id: pytest
    name: pytest
    entry: python -m pytest
    language: system
    types: [python]
    pass_filenames: false
    always_run: false  # Only run when python files change
    stages: [manual]   # Run only when explicitly called
    args: ["-v", "-m", "fast", "tests/", "--tb=short", "--maxfail=3", "-x"]
