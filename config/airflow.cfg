# Airflow Configuration for ML Pipeline
# This file contains scheduler and execution settings

[core]
# The folder where your airflow DAGs are stored
dags_folder = /opt/airflow/dags

# Whether to load the examples that ship with Airflow
load_examples = False

# The executor class that airflow should use
executor = LocalExecutor

# Maximum number of threads to use for the scheduler
max_threads = 4

# How often (in seconds) to check for new files in the DAG directory
dag_dir_list_interval = 300

# Whether DAGs are paused by default at creation
dags_are_paused_at_creation = True

[webserver]
# The port on which to run the web server
web_server_port = 8080

# Number of workers to run the Gunicorn web server
workers = 1

# The worker timeout for the Gunicorn web server
worker_timeout = 120

[scheduler]
# How many seconds to wait between file-parsing loops
dag_dir_list_interval = 300

# How often should the scheduler check for orphaned tasks
orphaned_tasks_check_interval = 300

# The number of task instances allowed to run concurrently
max_active_tasks_per_dag = 16

[logging]
# The folder where airflow should store its log files
base_log_folder = /opt/airflow/logs

# Logging level
logging_level = INFO

# Whether to enable remote logging
remote_logging = False

[smtp]
# Configuration for email notifications (optional)
smtp_host = localhost
smtp_starttls = True
smtp_ssl = False
smtp_port = 587
smtp_mail_from = airflow@example.com
